[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-extraction-pipeline"
version = "0.1.0"
description = "Advanced RAG document extraction pipeline for MCA mini project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "docling>=2.0.0",
  "pypdf>=4.0.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=2.6.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.26.0",
  "google-genai>=1.0.0",
  "gradio>=4.44.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
